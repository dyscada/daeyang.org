<div class="prose">
<p>소규모 빌딩은 대기업 빌딩처럼 관리팀이 없습니다. 그래서 체크리스트가 더 중요합니다.</p>
<h2>연간 점검 12가지</h2>
<ul>
<li>옥상 방수 및 배수구 — 장마 전</li>
<li>전기 분전반 열화상 — 여름 전</li>
<li>소방 펌프 시운전 — 월 1회</li>
<li>정화조 및 배관 — 반기 1회</li>
<li>외벽 균열 및 실리콘 — 연 1회</li>
</ul>
<p>작게 꾸준히 하는 것이 큰 수리를 막습니다.</p>
