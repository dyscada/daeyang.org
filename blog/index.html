<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog — DAEYANG.ORG</title>
<style>
body{margin:0;background:#fff;color:#18181b;font-family:Inter,system-ui,sans-serif}
header{height:56px;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;padding:0 20px;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:10}
.wrap{max-width:720px;margin:0 auto;padding:40px 20px}
h1{font-size:36px;margin:0 0 24px}
.grid{display:grid;gap:12px}
.card{border:1px solid #e5e5e5;border-radius:16px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;transition:.15s;background:#fff}
.card:hover{border-color:#111;transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.06)}
a.card-link{text-decoration:none;color:inherit}
.loading{padding:40px;text-align:center;color:#71717a}
</style>
</head>
<body>
<header><a href="/" style="font-weight:700;font-size:13px;letter-spacing:.08em;text-decoration:none;color:#111">DAEYANG.ORG</a><a href="/write/" style="background:#111;color:#fff;padding:8px 14px;border-radius:999px;font-size:12px;text-decoration:none">✏️ 새 글</a></header>
<main class="wrap">
<h1>Blog</h1>
<div id="grid" class="grid"><div class="loading">⏳ 불러오는 중...</div></div>
</main>
<script>
(async()=>{
  const owner='dyscada';
  const repo='daeyang.org';
  const branch='main';
  const token=localStorage.getItem('writer92_ghToken')||localStorage.getItem('writer91_ghToken')||localStorage.getItem('writer9_ghToken')||'';
  const grid=document.getElementById('grid');
  try{
    const headers={Accept:'application/vnd.github.v3+json'};
    if(token) headers.Authorization=`token ${token}`;
    const res=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/blog?ref=${branch}`, {headers});
    if(!res.ok) throw new Error(res.status);
    const items=await res.json();
    const folders=items.filter(i=>i.type==='dir').map(i=>i.name).sort();
    localStorage.setItem('blog_list_backup', JSON.stringify(folders));
    grid.innerHTML=folders.map(name=>{
      const emojiMap={billiards:'🎱',swimming:'🏊',travel:'✈️',food:'🍜',daily:'📝',dev:'💻'};
      const emoji=emojiMap[name]||'📄';
      const titleMap={billiards:'3 쿠션',swimming:'수영'};
      const title=titleMap[name]||name;
      return `<a class="card-link" href="/blog/${name}/"><div class="card"><div><h3>${emoji} ${title}</h3><p>blog/${name}/</p></div><span>→</span></div></a>`;
    }).join('');
  }catch(e){
    const backup=JSON.parse(localStorage.getItem('blog_list_backup')||'["billiards","swimming"]');
    grid.innerHTML=backup.map(name=>`<a class="card-link" href="/blog/${name}/"><div class="card"><div><h3>📄 ${name}</h3><p>blog/${name}/</p></div><span>→</span></div></a>`).join('');
  }
})();
</script>
</body>
</html>
