<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAEYANG Writer v9.3 - daeyang.org 최종</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafafa;font-family:Inter,sans-serif}
header{height:56px;background:#fff;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;padding:0 20px;justify-content:space-between;position:sticky;top:0;z-index:10}
.wrap{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 56px)}@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.left{background:#fff;padding:20px;border-right:1px solid #e5e5e5;overflow:auto;max-height:calc(100vh - 56px)}
.right{padding:20px;background:#fafafa}
label{font-size:11px;color:#888;letter-spacing:.08em;text-transform:uppercase;display:block;margin:14px 0 6px;font-weight:600}
input,textarea{width:100%;border:1px solid #e5e5e5;border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit}
textarea{height:420px;line-height:1.6}
.btn{padding:11px 16px;border-radius:10px;border:1px solid #e5e5e5;background:#fff;cursor:pointer;font-size:13px;font-weight:600}
.btn.black{background:#111;color:#fff;border-color:#111}
.btn.blue{background:#2563eb;color:#fff !important;border-color:#2563eb !important}
#preview{border:1px solid #e5e5e5;background:#fff;border-radius:12px;padding:24px;line-height:1.8}
#preview a{color:#2563eb !important;text-decoration:underline !important;cursor:pointer !important}
#preview .video{margin:20px 0 6px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
#preview .video iframe{width:100%;height:100%;border:0}
.github-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;cursor:pointer;margin-top:20px;font-size:13px;font-weight:600}
.github-box{background:#f8fafc;border:1px solid #e2e8f0;border-top:0;border-radius:0 0 12px 12px;padding:16px;display:none}
.github-box.open{display:block}
.status{margin-top:12px;padding:12px;border-radius:10px;font-size:12px;display:none;line-height:1.5}
.status.ok{display:block;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.status.err{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.status.info{display:block;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
</style>
</head>
<body>
<header><b>DAEYANG WRITER v9.3</b><span style="font-size:12px;color:#16a34a">● dyscada / daeyang.org</span></header>
<div class="wrap">
<div class="left">
<label>slug</label><input id="slug" value="billiards">
<label>제목</label><input id="title" value="3 쿠션">
<label>날짜</label><input id="date" type="date">
<label>내용</label><textarea id="body">뒤돌리기
링크:https://www.youtube.com/watch?v=SROZvzcYSgg</textarea>
<button class="github-toggle" id="ghToggle"><span>🔑 GitHub 설정 (dyscada/daeyang.org)</span><span id="toggleIcon">▼</span></button>
<div class="github-box open" id="ghBox">
<label style="margin-top:0">Owner</label><input id="ghOwner" value="dyscada">
<label>Repo</label><input id="ghRepo" value="daeyang.org">
<label>Branch</label><input id="ghBranch" value="main">
<label>Token</label><input id="ghToken" type="password" placeholder="ghp_...">
</div>
<div style="margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
<button class="btn blue" id="saveGh" style="grid-column:1/-1">🚀 GitHub에 바로 저장</button>
<button class="btn black" id="dl">💾 HTML 다운로드</button>
<button class="btn" id="copyBtn">📋 복사</button>
</div>
<div id="status" class="status"></div>
</div>
<div class="right"><div id="preview"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
$('date').valueAsDate=new Date();
['ghOwner','ghRepo','ghBranch','ghToken','slug','title'].forEach(k=>{ const v=localStorage.getItem('writer92_'+k)||localStorage.getItem('writer91_'+k); if(v) $(k).value=v; });
if(!$('ghOwner').value) $('ghOwner').value='dyscada';
if(!$('ghRepo').value) $('ghRepo').value='daeyang.org';
function saveLocal(){ ['ghOwner','ghRepo','ghBranch','ghToken','slug','title'].forEach(k=>localStorage.setItem('writer92_'+k, $(k).value)); }
document.querySelectorAll('input').forEach(el=>el.addEventListener('input',saveLocal));
$('ghToggle').addEventListener('click',()=>{ const box=$('ghBox'); const isOpen=box.classList.toggle('open'); $('toggleIcon').textContent=isOpen?'▼':'▶'; });
function ytId(s){try{const u=new URL(s.trim()); if(u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('?')[0]; if(u.searchParams.get('v')) return u.searchParams.get('v'); const m=s.match(/embed\/([^?&]+)/); if(m) return m[1];}catch(e){} return null;}
function mdToHtml(md){ return md.split('\n').map(line=>{ const t=line.trim(); if(!t) return ''; if(t.startsWith('## ')) return `<h2>${t.slice(3)}</h2>`; const m=t.match(/^링크\s*:\s*(https?:\/\/.+)$/i); if(m) return `<p><a href="${m[1].trim()}" target="_blank">${m[1].trim()}</a></p>`; const yid=ytId(t); if(yid && /^https?:\/\/.+youtu/.test(t) && !t.toLowerCase().startsWith('링크')) return `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${yid}" allowfullscreen loading="lazy"></iframe></div>`; if(t.startsWith('http')) return `<p><a href="${t}" target="_blank">${t}</a></p>`; return `<p>${line}</p>`; }).join('\n'); }
function buildHtml(){ const title=$('title').value; const content=mdToHtml($('body').value); return `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>${title}</title><style>body{margin:0;padding:40px;max-width:680px;margin:auto;line-height:1.8;font-family:Inter} a{color:#2563eb;text-decoration:underline}.video{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin:20px 0}.video iframe{width:100%;height:100%;border:0}.edit-fab{position:fixed;bottom:20px;right:20px;background:#111;color:#fff;padding:14px 20px;border-radius:999px;text-decoration:none}</style></head><body><h1>${title}</h1><article>${content}</article><a class="edit-fab" href="/write/?edit=${$('slug').value}">EDIT</a></body></html>`; }
function render(){ $('preview').innerHTML=`<h1>${$('title').value}</h1><div>${mdToHtml($('body').value)}</div>`; }
$('title').addEventListener('input',render); $('body').addEventListener('input',render); render();
$('dl').addEventListener('click',()=>{ const b=new Blob([buildHtml()],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='index.html'; a.click(); });
$('copyBtn').addEventListener('click',()=>{ navigator.clipboard.writeText(buildHtml()); const s=$('status'); s.className='status ok'; s.textContent='복사됨'; });
async function saveToGithub(){ const owner=$('ghOwner').value.trim(), repo=$('ghRepo').value.trim(), token=$('ghToken').value.trim(), branch=$('ghBranch').value.trim()||'main', slug=$('slug').value.trim(); const status=$('status'); if(!owner||!repo||!token){ status.className='status err'; status.textContent='Owner/Repo/Token 입력'; return; } saveLocal(); status.className='status info'; status.textContent='⏳ 저장 중...'; try{ const path=`blog/${slug}/index.html`; const apiBase=`https://api.github.com/repos/${owner}/${repo}/contents/${path}`; let sha=null; try{ const getRes=await fetch(`${apiBase}?ref=${branch}`,{headers:{Authorization:`token ${token}`}}); if(getRes.ok){ const j=await getRes.json(); sha=j.sha; } }catch(e){} const contentB64=btoa(unescape(encodeURIComponent(buildHtml()))); const body={message:`Update ${slug}`, content:contentB64, branch}; if(sha) body.sha=sha; const putRes=await fetch(apiBase,{method:'PUT', headers:{Authorization:`token ${token}`,'Content-Type':'application/json'}, body:JSON.stringify(body)}); const putJson=await putRes.json(); if(!putRes.ok) throw new Error(putJson.message); status.className='status ok'; status.innerHTML=`✅ 저장 성공! <a href="${putJson.commit.html_url}" target="_blank">커밋 보기</a>`; }catch(err){ status.className='status err'; status.textContent='❌ '+err.message; } }
$('saveGh').addEventListener('click',saveToGithub);
</script>
</body>
</html>
