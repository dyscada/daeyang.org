<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAEYANG Writer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafafa;font-family:Inter,sans-serif}
header{height:56px;background:#fff;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;padding:0 20px;justify-content:space-between}
.wrap{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 56px)}@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.left{background:#fff;padding:24px;border-right:1px solid #e5e5e5}
.right{padding:24px;background:#fafafa}
label{font-size:11px;color:#888;letter-spacing:.1em;text-transform:uppercase;display:block;margin:16px 0 6px}
input,textarea{width:100%;border:1px solid #e5e5e5;border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit}
textarea{height:480px;line-height:1.6}
.btn{padding:9px 14px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;cursor:pointer;font-size:13px}
.btn.black{background:#111;color:#fff;border-color:#111}
pre{white-space:pre-wrap;word-break:break-all}
#preview{border:1px solid #e5e5e5;background:#fff;border-radius:12px;padding:24px}
#preview .video iframe{width:100%;height:360px;border-radius:12px}
</style>
</head>
<body>
<header><b>DAEYANG WRITER v5 - 줄바꿈 수정판</b><span style="font-size:12px;color:#888">/write/</span></header>
<div class="wrap">
<div class="left">
<div style="display:flex;gap:8px"><input id="slug" placeholder="billiards" value="billiards"><button class="btn" id="load">불러오기</button></div>
<label>제목</label><input id="title" value="3 쿠션">
<label>태그</label><input id="tag" value="billiards">
<label>날짜</label><input id="date" type="date">
<label>내용 - 유튜브 링크는 한 줄에 하나씩</label><textarea id="body">뒤돌리기

내공이 45도로 가면 득점 확률이 50% 올라가는 자리.

https://www.youtube.com/watch?v=SROZvzcYSgg

옆돌리기

앞돌리기
</textarea>
<div style="margin-top:16px;display:flex;gap:8px">
<button class="btn black" id="dl">HTML 다운로드 (예쁘게)</button>
<button class="btn" id="copy">소스 복사</button>
</div>
<div id="status" style="font-size:11px;color:#888;margin-top:10px"></div>
</div>
<div class="right">
<div id="preview"></div>
<pre id="srcPreview" style="margin-top:16px;background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:16px;font-size:11px;max-height:400px;overflow:auto"></pre>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
$('date').valueAsDate=new Date();
function ytId(s){try{const u=new URL(s.trim()); if(u.hostname.includes('youtu.be')) return u.pathname.slice(1); if(u.searchParams.get('v')) return u.searchParams.get('v'); const m=s.match(/embed\/([^?&]+)/); if(m) return m[1];}catch(e){} return null;}
function mdToHtml(md){
  return md.split('\n').map(line=>{
    const t=line.trim(); if(!t) return '';
    if(t.startsWith('## ')) return `    <h2>${t.slice(3)}</h2>`;
    const yid=ytId(t); if(yid && t.startsWith('http')) return `    <div class="video">\n      <iframe src="https://www.youtube-nocookie.com/embed/${yid}" frameborder="0" allowfullscreen></iframe>\n    </div>`;
    if(t.startsWith('- ')) return `    <li>${t.slice(2)}</li>`;
    return `    <p>${t}</p>`;
  }).join('\n');
}
function build(){
  const title=$('title').value||'제목'; const tag=$('tag').value||''; const date=$('date').value; const content=mdToHtml($('body').value);
return `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${title} — DAEYANG.ORG</title>
  <style>
    body { margin:0; background:#fff; color:#18181b; font-family:Inter,sans-serif; line-height:1.7; }
    .wrap { max-width:680px; margin:0 auto; padding:48px 24px; }
    h1 { font-size:36px; }
    h2 { font-size:22px; margin:32px 0 12px; }
    p { margin:16px 0; }
    .video { margin:24px 0; aspect-ratio:16/9; border-radius:12px; overflow:hidden; border:1px solid #e5e5e5; }
    .video iframe { width:100%; height:100%; border:0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div>${tag} / ${date}</div>
    <h1>${title}</h1>
    <div class="content">
${content}
    </div>
  </div>
</body>
</html>
`;
}
function render(){
  const html=build();
  const content=mdToHtml($('body').value);
  $('preview').innerHTML=`<h1>${$('title').value}</h1><div>${content}</div>`;
  $('srcPreview').textContent=html;
}
$('title').addEventListener('input',render); $('tag').addEventListener('input',render); $('body').addEventListener('input',render); $('date').addEventListener('change',render);
$('dl').addEventListener('click',()=>{ const html=build(); const blob=new Blob([html],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='index.html'; a.click(); $('status').textContent='다운로드 완료 - 이제 줄바꿈 예쁘게 됨!'; });
$('copy').addEventListener('click',()=>{ navigator.clipboard.writeText(build()); $('status').textContent='복사됨'; });
$('load').addEventListener('click',async()=>{
  const slug=$('slug').value.trim(); if(!slug) return;
  $('status').textContent='불러오는 중...';
  try{
    const res=await fetch(`/blog/${slug}/index.html?v=${Date.now()}`,{cache:'no-store'});
    const txt=await res.text();
    const doc=new DOMParser().parseFromString(txt,'text/html');
    const h1=doc.querySelector('h1'); if(h1) $('title').value=h1.textContent.trim();
    const content=doc.querySelector('.content')||doc.querySelector('article')||doc.querySelector('.wrap');
    if(content){
      let md=''; content.childNodes.forEach(n=>{
        if(n.tagName==='H2') md+=n.textContent.trim()+'\n\n';
        if(n.tagName==='P') md+=n.textContent.trim()+'\n\n';
        if(n.tagName==='DIV' && n.classList.contains('video')){ const ifr=n.querySelector('iframe'); if(ifr){ const m=ifr.src.match(/embed\/([^?]+)/); if(m) md+=`https://www.youtube.com/watch?v=${m[1]}\n\n`; } }
        if(n.nodeType===3 && n.textContent.trim()) md+=n.textContent.trim()+'\n\n';
      });
      $('body').value=md.trim();
    }
    render(); $('status').textContent='불러오기 성공';
  }catch(e){ $('status').textContent='실패: '+e.message; }
});
render();
</script>
</body>
</html>
