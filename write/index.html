## 왜 필요한가
도시가스 배관에서 미세 누출은 초기엔 센서 노이즈로 묻히기 쉽다. 우리는 3단계 필터로 이를 걸러냈다.

1차: 이동평균 30초
2차: 변화율 임계치
3차: 건물 재실 패턴 교차 검증

이렇게 하면 오탐은 줄고, 실제 누출은 2분 안에 잡힌다.
